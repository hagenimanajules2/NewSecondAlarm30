
name: Build Second Alarm APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: "SecondAlarm_30min_Repeating_Updated (1)/SecondAlarm"
        run: |
          gradle --version
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SecondAlarm-APK
          path: "SecondAlarm_30min_Repeating_Updated (1)/SecondAlarm/app/build/outputs/apk/debug/app-debug.apk"
